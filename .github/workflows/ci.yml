name: CI

# Maintainer policy (v0.6.0): CI runs only when dispatched by hand, at the close
# of a round, on the revision being qualified. Day-to-day validation is local
# (python scripts/qualify.py). Jobs, matrices and checks are unchanged.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python scripts/validate_package.py
      - run: python -m unittest discover -s evals -p "test_*.py" -v
      - name: Semantic eval suite (dev set must pass completely)
        run: voznativa eval evals/semantic/cases.jsonl
      - name: Interactive human review through a real pseudo-terminal
        if: runner.os == 'Linux'
        run: python scripts/pty_review_check.py

  package:
    # Build sdist -> wheel, install it in a clean venv and run every command
    # outside the checkout, so the bundled references/ and data are proven.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist --outdir dist .
      - name: Build the wheel from the sdist
        run: |
          mkdir sdist && tar xzf dist/*.tar.gz -C sdist
          python -m pip wheel --no-deps --wheel-dir dist sdist/*/
      - name: Install the wheel in a clean venv and smoke-test outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          if [ -x "$RUNNER_TEMP/venv/bin/python" ]; then PY="$RUNNER_TEMP/venv/bin/python"; else PY="$RUNNER_TEMP/venv/Scripts/python"; fi
          "$PY" -m pip install dist/*.whl
          cp scripts/smoke_installed.py "$RUNNER_TEMP/smoke.py"
          cd "$RUNNER_TEMP" && "$PY" -I smoke.py
