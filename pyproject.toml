[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voznativa"
dynamic = ["version"]
description = "Brazilian Portuguese voice engine and Agent Skill with semantic preservation gates"
readme = "README.md"
requires-python = ">=3.11"
# SPDX expression and file (PEP 639, setuptools >= 77). Covers original
# VozNativa material only; see LICENSE and docs/LICENSING.md.
license = "MIT"
license-files = ["LICENSE"]
# PyYAML reads the YAML reference manifest, packs and voice contracts.
# The semantic layer (spans, ledger, compare, judge) is stdlib-only.
dependencies = ["PyYAML>=6.0"]

[project.scripts]
voznativa = "voznativa.cli:main"

[tool.setuptools]
packages = ["voznativa", "voznativa.corpus"]

[tool.setuptools.package-data]
voznativa = ["data/*.json", "data/*.yml", "data/regional_packs/*.yml", "data/corpora/*.yml", "data/slang/*.yml",
             "data/community_packs/*.yml"]

[tool.setuptools.dynamic]
version = { attr = "voznativa.__version__" }

[tool.voznativa]
locale = "pt-BR"
