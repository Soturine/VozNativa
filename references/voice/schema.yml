# Voice Profile v2, as produced by `voznativa profile` (voznativa/profile.py).
# Validated by voznativa.profile.validate(). Derived statistics only:
# no raw text, no topic words, no identity attributes.
schema_version: 2
kind: voznativa.voice_profile
locale: pt-BR
profile:
  id: "<sha256 prefix of the sample hashes>"
  created_at: "<ISO 8601>"
source:
  type: samples
  sample_count: 0
  total_words: 0
  channels: {}            # channel -> number of samples
  sample_sha256: []       # hashes only; samples are not stored
  date_range: {from: null, to: null}
maturity: explicit_only   # explicit_only (<3 samples or <150 words) | provisional | channel_profile (>=6 in a channel)
style:                    # per feature: mean, stdev (null with 1 window), n windows; see voznativa/features.py
  sentence_words_mean: {mean: 0.0, stdev: null, n: 0}
  # ... one entry per name in voznativa.features.FEATURES (all rates are per 100 words or per sentence)
channels: {}              # channel -> same structure as style, for channels with >=2 samples
habits:                   # observable habits with evidence
  - id: abbreviation.vc   # abbreviation.* | contraction.* | community_term.* | opener.* | style.*
    value: true
    evidence_count: 0     # occurrences
    sample_support: 0     # samples where it occurs
    confidence: 0.0       # (support / samples) * samples / (samples + 1); 1 sample caps at 0.5
    stability: low        # low (<0.5) | medium | high (>=0.75)
    scope: lexicon
lexicon:                  # v1-compatible summary lists
  abbreviations: []
  contractions: []
  foreign_terms: []
  recurring: []           # always empty: topic words are not stored
inference_policy:
  observations_only: true
  infer_identity: false
  infer_sensitive_attributes: false
privacy:
  retain_raw_samples: false
limitations: []
